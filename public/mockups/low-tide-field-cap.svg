    <linearGradient id="brim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102a2f"/><stop offset="1" stop-color="#061316"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="620" fill="url(#bg)"/>
  <path d="M0 500 Q260 420 540 500 T900 470 V620 H0Z" fill="#0b1719" opacity=".7"/>
