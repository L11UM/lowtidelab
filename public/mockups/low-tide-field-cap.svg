  <path d="M219 353 Q444 390 684 357" fill="none" stroke="#5fa8a0" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="451" cy="287" r="55" fill="#0e272b" stroke="#8fc9c1" stroke-width="3"/>
  <path d="M418 293 Q451 258 484 293 Q451 328 418 293Z" fill="none" stroke="#e8c39a" stroke-width="5"/>
  <path d="M451 242 V333 M405 287 H497" stroke="#8fc9c1" stroke-width="2" opacity=".8"/>
  <text x="451" y="373" text-anchor="middle" fill="#dcece8" font-family="monospace" font-size="15" letter-spacing="4">FIELD STATION</text>
