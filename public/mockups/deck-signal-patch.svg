<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Low Tide Lab deck signal patch mockup</title>
  <desc id="desc">An embroidered round ocean signal patch with a compass and wave mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192326"/><stop offset="1" stop-color="#070c0e"/></linearGradient>
    <radialGradient id="patch" cx="40%" cy="30%"><stop stop-color="#214d50"/><stop offset="1" stop-color="#0c2529"/></radialGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="900" height="620" fill="url(#bg)"/>
  <path d="M0 410 Q220 330 470 420 T900 390 V620 H0Z" fill="#101a1c"/>
  <ellipse cx="450" cy="470" rx="190" ry="32" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <circle cx="450" cy="300" r="166" fill="#071214" stroke="#d9ab72" stroke-width="13"/>
  <circle cx="450" cy="300" r="145" fill="url(#patch)" stroke="#8fc9c1" stroke-width="3" stroke-dasharray="5 8"/>
  <circle cx="450" cy="300" r="73" fill="none" stroke="#8fc9c1" stroke-width="3"/>
  <path d="M450 191 V409 M341 300 H559" stroke="#8fc9c1" stroke-width="2" opacity=".55"/>
  <path d="M385 321 Q417 283 450 321 Q483 359 515 321" fill="none" stroke="#e8c39a" stroke-width="8" stroke-linecap="round"/>
  <path d="M405 352 Q433 325 461 352 Q489 379 517 352" fill="none" stroke="#8fc9c1" stroke-width="5" stroke-linecap="round"/>
  <text x="450" y="224" text-anchor="middle" fill="#dcece8" font-family="monospace" font-size="18" letter-spacing="5">LOW TIDE</text>
  <text x="450" y="397" text-anchor="middle" fill="#dcece8" font-family="monospace" font-size="15" letter-spacing="4">FIELD SIGNAL</text>
  <text x="46" y="72" fill="#8fc9c1" font-family="monospace" font-size="13" letter-spacing="3">LOW TIDE LAB / FIELD GEAR</text>
  <text x="854" y="566" text-anchor="end" fill="#8fa19d" font-family="monospace" font-size="11">MOCKUP / EMBROIDERED PATCH</text>
</svg>
