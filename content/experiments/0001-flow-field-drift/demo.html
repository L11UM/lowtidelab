<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Flow Field Drift</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1416;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 12px;
    font: 11px system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move to bend the current · click to scatter</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let width, height, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const PARTICLE_COUNT = 900;
  const particles = [];

  function spawn(p) {
    p.x = Math.random() * width;
    p.y = Math.random() * height;
    p.life = 0;
    p.maxLife = 200 + Math.random() * 300;
    p.hue = 165 + Math.random() * 40;
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = {};
    spawn(p);
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }

  let mouse = { x: -9999, y: -9999, active: false };
  let time = 0;

  function fieldAngle(x, y, t) {
    const scale = 0.0035;
    let angle =
      Math.sin(x * scale + t) * 1.4 +
      Math.cos(y * scale * 1.3 - t * 0.8) * 1.4 +
      Math.sin((x + y) * scale * 0.6 + t * 0.5);

    if (mouse.active) {
      const dx = x - mouse.x;
      const dy = y - mouse.y;
      const dist = Math.hypot(dx, dy);
      const radius = 220;
      if (dist < radius) {
        const pull = (1 - dist / radius) * 3.2;
        angle += Math.atan2(dy, dx) * 0 + pull * Math.sin(dist * 0.05 - t * 2);
      }
    }
    return angle;
  }

  function step() {
    time += 0.0025;
    ctx.fillStyle = 'rgba(11, 20, 22, 0.12)';
    ctx.fillRect(0, 0, width, height);

    for (const p of particles) {
      const angle = fieldAngle(p.x, p.y, time);
      const speed = 1.6;
      const px = p.x, py = p.y;
      p.x += Math.cos(angle) * speed;
      p.y += Math.sin(angle) * speed;
      p.life++;

      if (p.x < 0 || p.x > width || p.y < 0 || p.y > height || p.life > p.maxLife) {
        spawn(p);
        continue;
      }

      const fade = 1 - p.life / p.maxLife;
      ctx.strokeStyle = `hsla(${p.hue}, 70%, 65%, ${0.5 * fade})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  function setMouse(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
  }

  window.addEventListener('mousemove', (e) => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) setMouse(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('mouseleave', () => { mouse.active = false; });

  window.addEventListener('click', () => {
    for (const p of particles) {
      p.x += (Math.random() - 0.5) * 300;
      p.y += (Math.random() - 0.5) * 300;
    }
  });

  ctx.fillStyle = '#0b1416';
  ctx.fillRect(0, 0, width, height);
  requestAnimationFrame(step);
</script>
</body>
</html>
